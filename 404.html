<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Year 11 AIT ATAR</title>
    <script>
      // SPA redirect for GitHub Pages: encode the path into a query string
      // and hand off to index.html, which decodes it back.
      // pathSegmentsToKeep = 1 because the repo lives at /11-ait-atar-course/
      var l = window.location;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 2).join('/') + '/?/' +
        l.pathname.slice(1).split('/').slice(1).join('/').replace(/&/g, '~and~') +
        (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    </script>
  </head>
  <body></body>
</html>
